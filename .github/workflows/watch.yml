name: Seraphine News Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # запуск каждые 15 минут
  workflow_dispatch: {}       # + можно запускать вручную кнопкой на GitHub

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated seen_ids.json
        run: |
          git config user.name "seraphine-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json
          git diff --quiet --cached || git commit -m "update seen ids"
          git push
